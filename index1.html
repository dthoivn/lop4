<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Đăng nhập thi</title>
<style>
body {
    font-family: Arial;
    background: linear-gradient(to right, #74ebd5, #acb6e5);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.box {
    background: white;
    padding: 30px;
    border-radius: 15px;
    text-align: center;
}

input {
    display: block;
    margin: 10px auto;
    padding: 10px;
    width: 250px;
}

button {
    padding: 10px 20px;
    background: #27ae60;
    color: white;
    border: none;
    border-radius: 10px;
}
</style>
</head>

<body>

<div class="box">
<h2>🔐 Đăng nhập</h2>

<input id="name" placeholder="Họ và tên">
<input id="class" placeholder="Lớp">

<button onclick="login()">Bắt đầu thi</button>
</div>

<script>
function login() {
    let name = document.getElementById("name").value;
    let lop = document.getElementById("class").value;

    if (!name || !lop) {
        alert("Nhập đầy đủ thông tin!");
        return;
    }

    localStorage.setItem("studentName", name);
    localStorage.setItem("studentClass", lop);

    window.location = "exam.html";
}
</script>

</body>
</html>
