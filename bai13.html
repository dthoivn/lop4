<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Quiz Classroom PRO</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Arial;
background:#eef4ff;
margin:0;
text-align:center
}

.card{
max-width:900px;
margin:auto;
margin-top:20px;
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.15)
}

input{
padding:10px;
font-size:16px;
border-radius:8px;
border:1px solid #ccc;
width:220px
}

.answers{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-top:20px
}

.answer{
padding:18px;
border-radius:12px;
font-size:18px;
cursor:pointer;
transition:.25s;
font-weight:bold
}

.answer:hover{
transform:scale(1.05)
}

.a0{background:#ff7675}
.a1{background:#74b9ff}
.a2{background:#ffeaa7}
.a3{background:#55efc4}

.correct{
background:#2ecc71!important;
transform:scale(1.15)
}

.wrong{
opacity:.3
}

.timer{
font-size:24px;
color:#e74c3c;
font-weight:bold
}

#progressBar{
width:100%;
height:12px;
background:#ddd;
border-radius:10px;
margin-top:15px;
overflow:hidden
}

#progress{
height:100%;
width:0%;
background:#2ecc71
}

button{
padding:12px 25px;
font-size:16px;
border:none;
border-radius:10px;
background:#0984e3;
color:white;
cursor:pointer
}

button:hover{
background:#0652dd
}

canvas{
max-width:300px;
margin-top:20px
}

/* mobile */

@media(max-width:600px){

.answers{
grid-template-columns:1fr
}

.answer{
font-size:16px
}

}

</style>
</head>

<body>

<div class="card">

<h2>Quiz Tin học 4 - Bài 13 - Tạo chương trình máy tính</h2>

<input id="name" placeholder="Họ tên học sinh">
<br><br>

<input id="class" placeholder="Lớp">
<br><br>

<button onclick="start()">BẮT ĐẦU</button>

<div id="quiz" style="display:none">

<div class="timer" id="time">30:00</div>

<div id="progressBar">
<div id="progress"></div>
</div>

<h3 id="question"></h3>

<div class="answers" id="answers"></div>

<div id="correctText"></div>

</div>

<div id="result"></div>

<canvas id="chart"></canvas>

</div>

<audio id="correctSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_5b0f4d2c03.mp3"></audio>
<audio id="wrongSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_0d30a3c0d2.mp3"></audio>

<script>

let studentName=""
let studentClass=""

let questions=[

["Scratch có thể dùng để làm gì?",["Kể chuyện bằng chương trình","Chỉ vẽ hình","Chỉ nghe nhạc","Chỉ xem video"],0],
["Trong Scratch nhân vật mèo có thể làm gì?",["Nói chuyện","In văn bản","Tắt máy","Mở web"],0],
["Lệnh Nói trong Scratch dùng để làm gì?",["Hiển thị lời nói","Di chuyển","Xóa nhân vật","Đổi màu"],0],
["Trong lệnh Nói có mấy ô nhập?",["2","1","3","4"],0],
["Ô thứ nhất trong lệnh Nói dùng để làm gì?",["Nhập nội dung lời nói","Nhập hình ảnh","Nhập màu","Nhập âm thanh"],0],

["Ô thứ hai trong lệnh Nói dùng để làm gì?",["Thời gian hiển thị","Màu chữ","Âm thanh","Hình ảnh"],0],
["Các lệnh Scratch được nối với nhau như thế nào?",["Qua khớp nối","Qua dây","Qua chuột","Qua bàn phím"],0],
["Các lệnh trong chương trình chạy theo thứ tự nào?",["Từ trên xuống","Từ dưới lên","Ngẫu nhiên","Từ trái sang"],0],
["Để chạy chương trình Scratch cần nhấn gì?",["Cờ xanh","Enter","Delete","Tab"],0],
["Sau khi chạy chương trình mèo sẽ làm gì?",["Kể chuyện","Biến mất","Ngủ","Đổi màu"],0],

["Chương trình trong bài kể câu chuyện gì?",["Mèo con không vâng lời","Mèo và chuột","Chó và mèo","Mèo đi học"],0],
["Chương trình có bao nhiêu lệnh nói?",["5","3","4","6"],0],
["Các lệnh nói hiển thị gì?",["Nội dung câu chuyện","Hình ảnh","Âm thanh","Video"],0],
["Scratch có thể kể chuyện theo dạng gì?",["Theo từng bước","Ngẫu nhiên","Không thứ tự","Theo màu"],0],
["Một chương trình Scratch gồm gì?",["Các khối lệnh","Các hình ảnh","Các video","Các bài hát"],0],

["Để tạo chương trình cần làm gì?",["Kéo thả lệnh","Nhấn Delete","Nhấn Ctrl","Nhấn Esc"],0],
["Nhóm lệnh chứa lệnh Cờ xanh là gì?",["Sự kiện","Âm thanh","Hiển thị","Chuyển động"],0],
["Lệnh Cờ xanh dùng để làm gì?",["Bắt đầu chương trình","Xóa chương trình","Lưu chương trình","Đổi màu"],0],
["Nhóm lệnh chứa lệnh Nói là gì?",["Hiển thị","Sự kiện","Âm thanh","Chuyển động"],0],
["Lệnh Nói giúp nhân vật làm gì?",["Hiển thị lời nói","Di chuyển","Nhảy","Xóa"],0],

["Để tạo chương trình cần làm gì với lệnh?",["Ghép nối","Xóa","Ẩn","In"],0],
["Nếu thay đổi nội dung lời nói thì sao?",["Câu chuyện thay đổi","Không đổi","Máy tắt","Game lỗi"],0],
["Nếu thay đổi thời gian hiển thị thì sao?",["Thời gian nói thay đổi","Không đổi","Máy tắt","Game lỗi"],0],
["Để xóa một lệnh cần làm gì?",["Nháy phải chuột","Nhấn Enter","Nhấn Tab","Nhấn Ctrl"],0],
["Sau đó chọn gì?",["Xóa khối","Save","Open","Close"],0],

["Để lưu chương trình cần vào đâu?",["Tập tin","Home","View","Design"],0],
["Sau khi vào Tập tin cần chọn gì?",["Lưu về máy tính","Open","Delete","Close"],0],
["Sau đó cần làm gì?",["Chọn thư mục","Xóa tệp","Đổi màu","Đóng chương trình"],0],
["Tiếp theo cần làm gì?",["Gõ tên tệp","Nhấn Delete","Nhấn Ctrl","Nhấn Tab"],0],
["Cuối cùng cần nhấn gì?",["Save","Delete","Close","Open"],0],

["Khi lưu chương trình Scratch tệp có đuôi gì?",[".sb3",".txt",".jpg",".doc"],0],
["Chương trình Scratch kể chuyện dựa trên gì?",["Trình tự các bước","Màu sắc","Âm thanh","Hình ảnh"],0],
["Ví dụ kể chuyện theo trình tự là gì?",["Các việc buổi sáng","Nghe nhạc","Xem phim","Chơi game"],0],
["Chương trình Scratch có thể kể gì?",["Câu chuyện","Chỉ số","Chỉ hình","Chỉ video"],0],
["Để tạo nhiều câu nói cần làm gì?",["Thêm nhiều lệnh Nói","Xóa lệnh","Đổi màu","Chèn ảnh"],0],

["Các lệnh nói sẽ chạy như thế nào?",["Lần lượt","Ngẫu nhiên","Không chạy","Chạy cùng lúc"],0],
["Scratch giúp học sinh làm gì?",["Học lập trình","Chỉ chơi game","Chỉ vẽ","Chỉ nghe nhạc"],0],
["Một chương trình Scratch có thể kể gì?",["Một câu chuyện","Một bài hát","Một video","Một hình"],0],
["Chương trình kể chuyện được tạo từ gì?",["Các khối lệnh","Các ảnh","Các video","Các âm thanh"],0],
["Sau khi tạo chương trình cần làm gì?",["Chạy thử","Xóa","Đóng","In"],0],

["Sau khi chỉnh sửa nên làm gì?",["Lưu chương trình","Xóa","Đổi màu","Tắt máy"],0],
["Scratch giúp tạo gì?",["Chương trình","Chỉ ảnh","Chỉ video","Chỉ âm thanh"],0],
["Chương trình Scratch chạy ở đâu?",["Sân khấu","Chuột","Bàn phím","Ổ đĩa"],0],
["Khi chạy chương trình nhân vật sẽ gì?",["Thực hiện lệnh","Ngủ","Biến mất","Tắt"],0],
["Bài 13 dạy học sinh điều gì?",["Tạo chương trình kể chuyện","Chơi game","Nghe nhạc","Vẽ hình"],0]

];
questions.sort(()=>Math.random()-0.5)

let current=0
let correctCount=0
let wrongCount=0
let totalTime=1800
let timer

function start(){

studentName=document.getElementById("name").value.trim()
studentClass=document.getElementById("class").value.trim()

if(studentName==""||studentClass==""){
alert("Nhập tên và lớp")
return
}

quiz.style.display="block"

startTimer()

load()

}

function startTimer(){

timer=setInterval(()=>{

totalTime--

let m=Math.floor(totalTime/60)
let s=totalTime%60

time.innerText=
String(m).padStart(2,'0')+":"+
String(s).padStart(2,'0')

if(totalTime<=0){
finish()
}

},1000)

}

function load(){

correctText.innerText=""

progress.style.width=(current/questions.length*100)+"%"

question.innerText="Câu "+(current+1)+": "+questions[current][0]

let ans=questions[current][1]
.map((a,i)=>({t:a,i}))
.sort(()=>Math.random()-0.5)

answers.innerHTML=""

ans.forEach((a,k)=>{

answers.innerHTML+=
`<div class="answer a${k}" onclick="choose(${a.i})">${a.t}</div>`

})

}

function choose(i){

let correct=questions[current][2]
let correctAns=questions[current][1][correct]

document.querySelectorAll(".answer").forEach(el=>{

if(el.innerText===correctAns)
el.classList.add("correct")
else
el.classList.add("wrong")

})

if(i===correct){
correctCount++
correctSound.play()
}else{
wrongCount++
wrongSound.play()
}

correctText.innerText="Đáp án đúng: "+correctAns

setTimeout(()=>{

current++

if(current<questions.length){
load()
}else{
finish()
}

},1200)

}

function finish(){

clearInterval(timer)

quiz.style.display="none"

let total=questions.length
let percent=Math.round(correctCount/total*100)

let grade=""

if(percent>=80) grade="Giỏi"
else if(percent>=65) grade="Khá"
else if(percent>=50) grade="Trung bình"
else grade="Cần cố gắng"

result.innerHTML=

"<h2>Hoàn thành bài</h2>"+
"<p>Học sinh: "+studentName+"</p>"+
"<p>Lớp: "+studentClass+"</p>"+
"<h3>Đúng: "+correctCount+"</h3>"+
"<h3>Sai: "+wrongCount+"</h3>"+
"<h3>Tỷ lệ: "+percent+"%</h3>"+
"<h3>Xếp loại: "+grade+"</h3>"+
"<br><button onclick='location.reload()'>Làm lại bài</button>"

drawChart()

}

function drawChart(){

let c=document.getElementById("chart")
let ctx=c.getContext("2d")

let total=correctCount+wrongCount

let correctAngle=(correctCount/total)*2*Math.PI

ctx.clearRect(0,0,300,300)

ctx.beginPath()
ctx.moveTo(150,150)
ctx.arc(150,150,120,0,correctAngle)
ctx.fillStyle="#2ecc71"
ctx.fill()

ctx.beginPath()
ctx.moveTo(150,150)
ctx.arc(150,150,120,correctAngle,2*Math.PI)
ctx.fillStyle="#e74c3c"
ctx.fill()

}

</script>

</body>
</html>
