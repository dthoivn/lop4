<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Quiz Classroom PRO</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Arial;
background:#eef4ff;
margin:0;
text-align:center
}

.card{
max-width:900px;
margin:auto;
margin-top:20px;
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.15)
}

input{
padding:10px;
font-size:16px;
border-radius:8px;
border:1px solid #ccc;
width:220px
}

.answers{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-top:20px
}

.answer{
padding:18px;
border-radius:12px;
font-size:18px;
cursor:pointer;
transition:.25s;
font-weight:bold
}

.answer:hover{
transform:scale(1.05)
}

.a0{background:#ff7675}
.a1{background:#74b9ff}
.a2{background:#ffeaa7}
.a3{background:#55efc4}

.correct{
background:#2ecc71!important;
transform:scale(1.15)
}

.wrong{
opacity:.3
}

.timer{
font-size:24px;
color:#e74c3c;
font-weight:bold
}

#progressBar{
width:100%;
height:12px;
background:#ddd;
border-radius:10px;
margin-top:15px;
overflow:hidden
}

#progress{
height:100%;
width:0%;
background:#2ecc71
}

button{
padding:12px 25px;
font-size:16px;
border:none;
border-radius:10px;
background:#0984e3;
color:white;
cursor:pointer
}

button:hover{
background:#0652dd
}

canvas{
max-width:300px;
margin-top:20px
}

/* mobile */

@media(max-width:600px){

.answers{
grid-template-columns:1fr
}

.answer{
font-size:16px
}

}

</style>
</head>

<body>

<div class="card">

<h2>Quiz Tin học 4 - Bài 11 - Thực hành luyện tập gõ</h2>

<input id="name" placeholder="Họ tên học sinh">
<br><br>

<input id="class" placeholder="Lớp">
<br><br>

<button onclick="start()">BẮT ĐẦU</button>

<div id="quiz" style="display:none">

<div class="timer" id="time">30:00</div>

<div id="progressBar">
<div id="progress"></div>
</div>

<h3 id="question"></h3>

<div class="answers" id="answers"></div>

<div id="correctText"></div>

</div>

<div id="result"></div>

<canvas id="chart"></canvas>

</div>

<audio id="correctSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_5b0f4d2c03.mp3"></audio>
<audio id="wrongSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_0d30a3c0d2.mp3"></audio>

<script>

let studentName=""
let studentClass=""

let questions=[

["Bài 11B giúp học sinh luyện tập gì?",["Gõ bàn phím","Vẽ hình","Chơi game","Nghe nhạc"],0],
["Phím Shift dùng để làm gì?",["Gõ chữ hoa","Xóa chữ","Xuống dòng","Mở tệp"],0],
["Khi gõ chữ hoa cần làm gì?",["Giữ phím Shift","Nhấn Enter","Nhấn Ctrl","Nhấn Alt"],0],
["Phím Shift nằm ở đâu trên bàn phím?",["Hai bên bàn phím","Giữa bàn phím","Trên cùng","Dưới cùng"],0],
["Để gõ chữ K hoa cần làm gì?",["Giữ Shift và gõ K","Nhấn Ctrl","Nhấn Alt","Nhấn Tab"],0],

["Để gõ chữ hoa cần sử dụng phím nào?",["Shift","Ctrl","Alt","Tab"],0],
["Khi luyện tập gõ phím học sinh làm việc theo hình thức nào?",["Nhóm đôi","Một mình","Cả lớp","Theo nhóm 10"],0],
["Trong nhóm đôi có mấy học sinh?",["2","3","4","5"],0],
["Một bạn thực hành, bạn còn lại làm gì?",["Hướng dẫn","Chơi game","Nghe nhạc","Tắt máy"],0],
["Sau khi luyện tập cần làm gì?",["Đổi vai","Tắt máy","Xóa bài","Đổi máy"],0],

["Ngoài chữ hoa còn luyện tập gõ gì?",["Số","Video","Âm thanh","Hình ảnh"],0],
["Phím số nằm ở đâu?",["Hàng trên bàn phím","Hàng dưới","Bên trái","Bên phải"],0],
["Để gõ kí tự trên của phím số cần dùng gì?",["Shift","Ctrl","Alt","Tab"],0],
["Ví dụ kí tự trên phím số 5 là gì?",["%","$","@","&"],0],
["Để gõ dấu % cần làm gì?",["Shift + 5","Ctrl + 5","Alt + 5","Tab + 5"],0],

["Khi gõ % cần giữ phím nào?",["Shift","Ctrl","Alt","Tab"],0],
["Phím Shift trái thường dùng ngón nào?",["Ngón út trái","Ngón trỏ","Ngón cái","Ngón giữa"],0],
["Phím Shift phải dùng ngón nào?",["Ngón út phải","Ngón trỏ","Ngón cái","Ngón giữa"],0],
["Khi gõ chữ K dùng ngón nào?",["Ngón giữa phải","Ngón trỏ","Ngón cái","Ngón út"],0],
["Trong bài học dùng phần mềm gì để luyện gõ?",["Phần mềm luyện gõ","Paint","Word","PowerPoint"],0],

["Phần mềm luyện gõ giúp gì?",["Học gõ đúng","Chơi game","Nghe nhạc","Vẽ hình"],0],
["Nếu gõ sai phím thì sao?",["Phần mềm báo lỗi","Máy tắt","Màn hình tối","Loa kêu"],0],
["Ví dụ lỗi gõ sai là gì?",["Gõ 8 thay vì 6","Gõ 6 thay vì 6","Không gõ","Gõ đúng"],0],
["Thông báo lỗi giúp gì?",["Sửa lỗi","Tắt máy","Đổi máy","Chạy game"],0],
["Khi gõ bàn phím cần điều gì?",["Đúng ngón tay","Đúng màu","Đúng hình","Đúng âm"],0],

["Luyện gõ bàn phím giúp gì?",["Gõ nhanh và chính xác","Máy nhanh","Pin lâu","Màn hình sáng"],0],
["Bài luyện phím Shift có mấy bài học?",["6","3","2","10"],0],
["Bài luyện phím số có mấy bài học?",["3","2","5","6"],0],
["Để chọn bài học cần làm gì?",["Chọn bài trong danh sách","Tắt máy","Đổi máy","Xóa tệp"],0],
["Trước khi chọn bài cần làm gì?",["Chọn mục phím","Chọn ảnh","Chọn video","Chọn âm thanh"],0],

["Trong phần mềm có mục phím nào?",["Phím Shift","Phím video","Phím ảnh","Phím loa"],0],
["Ngoài Shift còn có mục nào?",["Phím số","Phím video","Phím hình","Phím loa"],0],
["Luyện gõ giúp học sinh điều gì?",["Gõ đúng bàn phím","Chơi game","Nghe nhạc","Vẽ hình"],0],
["Gõ đúng ngón tay giúp gì?",["Nhanh hơn","Chậm hơn","Sai hơn","Khó hơn"],0],
["Khi luyện gõ cần chú ý điều gì?",["Đúng phím","Đúng màu","Đúng hình","Đúng âm"],0],

["Nếu gõ sai phím phần mềm làm gì?",["Báo lỗi","Tắt máy","Đổi máy","Xóa bài"],0],
["Bài học yêu cầu làm việc như thế nào?",["Theo nhóm đôi","Một mình","Cả lớp","Theo nhóm 5"],0],
["Trong nhóm đôi sau khi luyện cần làm gì?",["Đổi vai","Tắt máy","Đổi máy","Xóa bài"],0],
["Gõ bàn phím đúng giúp gì?",["Tăng tốc độ gõ","Giảm pin","Tối màn hình","Tắt máy"],0],
["Phím Shift thường dùng với gì?",["Chữ hoa","Video","Ảnh","Nhạc"],0],

["Phím số dùng để gõ gì?",["Số và kí tự","Chỉ chữ","Chỉ ảnh","Chỉ video"],0],
["Kí tự trên phím số cần gì để gõ?",["Shift","Ctrl","Alt","Tab"],0],
["Khi luyện tập cần gì?",["Kiên nhẫn","Chơi game","Nghe nhạc","Xem phim"],0],
["Gõ đúng ngón tay giúp gì?",["Ít sai","Sai nhiều","Không đổi","Chậm"],0],
["Bài 11B dạy học sinh điều gì?",["Luyện tập gõ bàn phím","Chơi game","Nghe nhạc","Vẽ tranh"],0]

];

questions.sort(()=>Math.random()-0.5)

let current=0
let correctCount=0
let wrongCount=0
let totalTime=1800
let timer

function start(){

studentName=document.getElementById("name").value.trim()
studentClass=document.getElementById("class").value.trim()

if(studentName==""||studentClass==""){
alert("Nhập tên và lớp")
return
}

quiz.style.display="block"

startTimer()

load()

}

function startTimer(){

timer=setInterval(()=>{

totalTime--

let m=Math.floor(totalTime/60)
let s=totalTime%60

time.innerText=
String(m).padStart(2,'0')+":"+
String(s).padStart(2,'0')

if(totalTime<=0){
finish()
}

},1000)

}

function load(){

correctText.innerText=""

progress.style.width=(current/questions.length*100)+"%"

question.innerText="Câu "+(current+1)+": "+questions[current][0]

let ans=questions[current][1]
.map((a,i)=>({t:a,i}))
.sort(()=>Math.random()-0.5)

answers.innerHTML=""

ans.forEach((a,k)=>{

answers.innerHTML+=
`<div class="answer a${k}" onclick="choose(${a.i})">${a.t}</div>`

})

}

function choose(i){

let correct=questions[current][2]
let correctAns=questions[current][1][correct]

document.querySelectorAll(".answer").forEach(el=>{

if(el.innerText===correctAns)
el.classList.add("correct")
else
el.classList.add("wrong")

})

if(i===correct){
correctCount++
correctSound.play()
}else{
wrongCount++
wrongSound.play()
}

correctText.innerText="Đáp án đúng: "+correctAns

setTimeout(()=>{

current++

if(current<questions.length){
load()
}else{
finish()
}

},1200)

}

function finish(){

clearInterval(timer)

quiz.style.display="none"

let total=questions.length
let percent=Math.round(correctCount/total*100)

let grade=""

if(percent>=80) grade="Giỏi"
else if(percent>=65) grade="Khá"
else if(percent>=50) grade="Trung bình"
else grade="Cần cố gắng"

result.innerHTML=

"<h2>Hoàn thành bài</h2>"+
"<p>Học sinh: "+studentName+"</p>"+
"<p>Lớp: "+studentClass+"</p>"+
"<h3>Đúng: "+correctCount+"</h3>"+
"<h3>Sai: "+wrongCount+"</h3>"+
"<h3>Tỷ lệ: "+percent+"%</h3>"+
"<h3>Xếp loại: "+grade+"</h3>"+
"<br><button onclick='location.reload()'>Làm lại bài</button>"

drawChart()

}

function drawChart(){

let c=document.getElementById("chart")
let ctx=c.getContext("2d")

let total=correctCount+wrongCount

let correctAngle=(correctCount/total)*2*Math.PI

ctx.clearRect(0,0,300,300)

ctx.beginPath()
ctx.moveTo(150,150)
ctx.arc(150,150,120,0,correctAngle)
ctx.fillStyle="#2ecc71"
ctx.fill()

ctx.beginPath()
ctx.moveTo(150,150)
ctx.arc(150,150,120,correctAngle,2*Math.PI)
ctx.fillStyle="#e74c3c"
ctx.fill()

}

</script>

</body>
</html>
