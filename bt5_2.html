<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Bài thực hành</title>

<style>
body{font-family:Arial;background:#f1f5f9;padding:20px}
.card{background:white;border-radius:16px;padding:15px;max-width:750px;margin:auto;box-shadow:0 10px 25px rgba(0,0,0,.2)}
h2{text-align:center}

details{padding:12px;border-radius:14px;margin-bottom:15px;background:#e0f2fe}
.step{padding:6px;border-radius:6px;margin:4px 0;color:#000}

.c1{background:#fecaca}
.c2{background:#fde68a}
.c3{background:#bbf7d0}
.c4{background:#bae6fd}
.c5{background:#ddd6fe}

button{margin-top:8px;padding:6px 15px;border:none;border-radius:20px;background:#22c55e;color:white;cursor:pointer}

.progress{height:20px;background:#e5e7eb;border-radius:10px;overflow:hidden;margin:10px 0}
.bar{height:100%;width:0%;background:linear-gradient(90deg,#22c55e,#4ade80);transition:.5s}

table{width:100%;border-collapse:collapse;margin-top:10px}
td,th{border:1px solid #ccc;padding:6px;text-align:center}

.fire{
position:fixed;width:8px;height:8px;border-radius:50%;
animation:boom 1s forwards
}
@keyframes boom{
to{transform:translate(var(--x),var(--y));opacity:0}
}
</style>
</head>

<body>

<div class="card">

<h2>📚 BÀI THỰC HÀNH TIN HỌC</h2>

<div>Tiến độ học tập:</div>
<div class="progress"><div id="bar" class="bar"></div></div>
<div id="percent">0%</div>

<input id="student" placeholder="Tên học sinh">

<details>
<summary><b>🌟 Bài 1</b></summary>
<div class="step c1">Mở ổ D:</div>
<div class="step c2">Tạo thư mục lớp</div>
<div class="step c3">Tạo Lớp 4A</div>
<div class="step c4">Tạo Lưu trữ</div>
<button onclick="done(event,1)">HOÀN THÀNH</button>
</details>

<details>
<summary><b>📋 Bài 2</b></summary>
<div class="step c1">Chọn thư mục</div>
<div class="step c2">Ctrl + C</div>
<div class="step c3">Ctrl + V</div>
<button onclick="done(event,2)">HOÀN THÀNH</button>
</details>

<details>
<summary><b>✂️ Bài 3</b></summary>
<div class="step c1">Chọn Truyện</div>
<div class="step c2">Ctrl + X</div>
<div class="step c3">Ctrl + V</div>
<button onclick="done(event,3)">HOÀN THÀNH</button>
</details>

<h3>🏆 Bảng thành tích</h3>

<table>
<thead>
<tr><th>Học sinh</th><th>Bài hoàn thành</th></tr>
</thead>
<tbody id="board"></tbody>
</table>

</div>

<script>
let finished = new Set()
let scores = {}

function done(e,n){
 e.stopPropagation()
 if(finished.has(n)) return
 finished.add(n)

 fire()

 updateProgress()

 const name = student.value || "Chưa nhập tên"
 scores[name] = finished.size

 renderBoard()
}

function updateProgress(){
 const total=3
 const p=Math.round(finished.size/total*100)
 bar.style.width=p+"%"
 percent.innerText=p+"%"
}

function renderBoard(){
 board.innerHTML=""
 Object.keys(scores).forEach(k=>{
  board.innerHTML+=`<tr><td>${k}</td><td>${scores[k]}</td></tr>`
 })
}

function fire(){
 for(let i=0;i<20;i++){
  const d=document.createElement("div")
  d.className="fire"
  d.style.left=innerWidth/2+"px"
  d.style.top=innerHeight/2+"px"
  d.style.background=`hsl(${Math.random()*360},100%,60%)`
  d.style.setProperty("--x",(Math.random()*300-150)+"px")
  d.style.setProperty("--y",(Math.random()*300-150)+"px")
  document.body.appendChild(d)
  setTimeout(()=>d.remove(),1000)
 }
}
</script>

</body>
</html>
