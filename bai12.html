<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Quiz Classroom PRO</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Arial;
background:#eef4ff;
margin:0;
text-align:center
}

.card{
max-width:900px;
margin:auto;
margin-top:20px;
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.15)
}

input{
padding:10px;
font-size:16px;
border-radius:8px;
border:1px solid #ccc;
width:220px
}

.answers{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-top:20px
}

.answer{
padding:18px;
border-radius:12px;
font-size:18px;
cursor:pointer;
transition:.25s;
font-weight:bold
}

.answer:hover{
transform:scale(1.05)
}

.a0{background:#ff7675}
.a1{background:#74b9ff}
.a2{background:#ffeaa7}
.a3{background:#55efc4}

.correct{
background:#2ecc71!important;
transform:scale(1.15)
}

.wrong{
opacity:.3
}

.timer{
font-size:24px;
color:#e74c3c;
font-weight:bold
}

#progressBar{
width:100%;
height:12px;
background:#ddd;
border-radius:10px;
margin-top:15px;
overflow:hidden
}

#progress{
height:100%;
width:0%;
background:#2ecc71
}

button{
padding:12px 25px;
font-size:16px;
border:none;
border-radius:10px;
background:#0984e3;
color:white;
cursor:pointer
}

button:hover{
background:#0652dd
}

canvas{
max-width:300px;
margin-top:20px
}

/* mobile */

@media(max-width:600px){

.answers{
grid-template-columns:1fr
}

.answer{
font-size:16px
}

}

</style>
</head>

<body>

<div class="card">

<h2>Quiz Tin học 4 - Bài 12 - Làm quen với Scratch</h2>

<input id="name" placeholder="Họ tên học sinh">
<br><br>

<input id="class" placeholder="Lớp">
<br><br>

<button onclick="start()">BẮT ĐẦU</button>

<div id="quiz" style="display:none">

<div class="timer" id="time">30:00</div>

<div id="progressBar">
<div id="progress"></div>
</div>

<h3 id="question"></h3>

<div class="answers" id="answers"></div>

<div id="correctText"></div>

</div>

<div id="result"></div>

<canvas id="chart"></canvas>

</div>

<audio id="correctSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_5b0f4d2c03.mp3"></audio>
<audio id="wrongSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_0d30a3c0d2.mp3"></audio>

<script>

let studentName=""
let studentClass=""

let questions=[

["Scratch là gì?",["Phần mềm lập trình trực quan","Phần mềm vẽ","Phần mềm nghe nhạc","Phần mềm chơi game"],0],
["Scratch dùng để làm gì?",["Tạo chương trình và trò chơi","Soạn thảo văn bản","Xem video","Lướt web"],0],
["Để mở Scratch cần làm gì?",["Nháy đúp biểu tượng Scratch","Nhấn Enter","Nhấn Ctrl","Nhấn Alt"],0],
["Biểu tượng Scratch thường ở đâu?",["Màn hình nền","Bàn phím","Chuột","Ổ đĩa"],0],
["Trong bài học có trò chơi nào?",["Mèo bắt bóng","Đua xe","Cờ vua","Mario"],0],

["Tệp trò chơi mèo bắt bóng có tên gì?",["Meo bat bong.sb3","Game.sb3","CatGame.sb3","Scratch.sb3"],0],
["Để mở trò chơi trong Scratch cần chọn gì?",["Tập tin","View","Edit","Design"],0],
["Sau khi chọn Tập tin cần chọn gì?",["Mở từ máy tính","Save","Close","Exit"],0],
["Sau khi chọn tệp cần nhấn gì?",["Open","Save","Delete","Close"],0],
["Để di chuyển mèo trong trò chơi dùng phím nào?",["Phím mũi tên","Phím số","Phím Enter","Phím Tab"],0],

["Có mấy phím mũi tên điều khiển?",["4","2","6","8"],0],
["Các phím mũi tên gồm những gì?",["↑ ↓ ← →","A B C D","1 2 3 4","W A S D"],0],
["Khi mèo chạm vào bóng thì sao?",["Mèo nói một câu","Game dừng","Mèo biến mất","Máy tắt"],0],
["Câu mèo nói là gì?",["Tớ bắt được bóng rồi","Xin chào","Game over","Hello"],0],
["Nhân vật trong Scratch gọi là gì?",["Sprite","Actor","Robot","Game"],0],

["Nơi nhân vật hoạt động gọi là gì?",["Sân khấu","Màn hình","Chuột","Bàn phím"],0],
["Chương trình Scratch nằm ở đâu?",["Khu vực chương trình","Thanh menu","Màn hình nền","Bàn phím"],0],
["Trò chơi trên sân khấu là gì?",["Kết quả của chương trình","Hình ảnh","Âm thanh","Video"],0],
["Nếu thay đổi chương trình thì sao?",["Trò chơi thay đổi","Không đổi","Máy tắt","Game lỗi"],0],
["Lệnh thay đổi X dùng để làm gì?",["Di chuyển ngang","Di chuyển dọc","Xóa nhân vật","Đổi màu"],0],

["Lệnh thay đổi Y dùng để làm gì?",["Di chuyển dọc","Di chuyển ngang","Xóa nhân vật","Đổi màu"],0],
["Nếu tăng số trong lệnh thay đổi X,Y thì sao?",["Di chuyển nhanh hơn","Chậm hơn","Không đổi","Dừng lại"],0],
["Nếu giảm số trong lệnh thay đổi X,Y thì sao?",["Di chuyển chậm hơn","Nhanh hơn","Không đổi","Dừng"],0],
["Để chỉnh sửa số trong lệnh cần làm gì?",["Nháy vào số","Nhấn Enter","Nhấn Delete","Nhấn Ctrl"],0],
["Để thay đổi lời nói của mèo cần sửa gì?",["Lệnh Nói","Lệnh Di chuyển","Lệnh Âm thanh","Lệnh Xóa"],0],

["Lệnh Nói dùng để làm gì?",["Hiển thị lời nói","Di chuyển","Xóa nhân vật","Đổi màu"],0],
["Để sửa lời nói cần làm gì?",["Nháy vào ô văn bản","Nhấn Enter","Nhấn Tab","Nhấn Alt"],0],
["Sau khi sửa lời nói thì sao?",["Mèo nói câu mới","Không đổi","Game dừng","Máy tắt"],0],
["Scratch giúp học sinh làm gì?",["Học lập trình","Chỉ chơi game","Chỉ vẽ","Chỉ nghe nhạc"],0],
["Trò chơi trong Scratch được tạo bằng gì?",["Chương trình","Video","Âm thanh","Hình ảnh"],0],

["Chương trình Scratch gồm gì?",["Các khối lệnh","Hình ảnh","Video","Âm thanh"],0],
["Các khối lệnh dùng để làm gì?",["Điều khiển nhân vật","Trang trí","Phát nhạc","Chụp ảnh"],0],
["Nếu thay đổi giá trị số thì sao?",["Tốc độ thay đổi","Không đổi","Máy tắt","Game lỗi"],0],
["Nếu số lớn hơn thì sao?",["Nhanh hơn","Chậm hơn","Không đổi","Dừng"],0],
["Nếu số nhỏ hơn thì sao?",["Chậm hơn","Nhanh hơn","Không đổi","Dừng"],0],

["Robot trong trò chơi robot tìm quà cần làm gì?",["Tránh đá","Nghe nhạc","Xóa file","Tắt máy"],0],
["Để robot di chuyển chậm hơn cần làm gì?",["Giảm số","Tăng số","Không đổi","Xóa lệnh"],0],
["Scratch có thể tạo gì?",["Trò chơi","Chỉ văn bản","Chỉ ảnh","Chỉ video"],0],
["Scratch thuộc loại phần mềm gì?",["Lập trình","Vẽ","Soạn thảo","Xem phim"],0],
["Chương trình Scratch nằm ở đâu trong cửa sổ?",["Khu vực lập trình","Thanh menu","Màn hình nền","Chuột"],0],

["Mỗi trò chơi trong Scratch là gì?",["Một chương trình","Một ảnh","Một video","Một tệp nhạc"],0],
["Khi chương trình chạy thì gì xảy ra?",["Trò chơi hoạt động","Máy tắt","File xóa","Chuột tắt"],0],
["Để mở chương trình cần vào đâu?",["Tập tin","Home","View","Design"],0],
["Sau đó chọn gì?",["Mở từ máy tính","Insert","Close","Delete"],0],
["Sau đó chọn gì nữa?",["Tệp chương trình","Hình ảnh","Video","Âm thanh"],0],

["Scratch giúp học sinh học gì?",["Lập trình","Vẽ","Nghe nhạc","Xem phim"],0],
["Bài 12 dạy học sinh điều gì?",["Làm quen với Scratch","Chơi game","Nghe nhạc","Vẽ tranh"],0]

];

questions.sort(()=>Math.random()-0.5)

let current=0
let correctCount=0
let wrongCount=0
let totalTime=1800
let timer

function start(){

studentName=document.getElementById("name").value.trim()
studentClass=document.getElementById("class").value.trim()

if(studentName==""||studentClass==""){
alert("Nhập tên và lớp")
return
}

quiz.style.display="block"

startTimer()

load()

}

function startTimer(){

timer=setInterval(()=>{

totalTime--

let m=Math.floor(totalTime/60)
let s=totalTime%60

time.innerText=
String(m).padStart(2,'0')+":"+
String(s).padStart(2,'0')

if(totalTime<=0){
finish()
}

},1000)

}

function load(){

correctText.innerText=""

progress.style.width=(current/questions.length*100)+"%"

question.innerText="Câu "+(current+1)+": "+questions[current][0]

let ans=questions[current][1]
.map((a,i)=>({t:a,i}))
.sort(()=>Math.random()-0.5)

answers.innerHTML=""

ans.forEach((a,k)=>{

answers.innerHTML+=
`<div class="answer a${k}" onclick="choose(${a.i})">${a.t}</div>`

})

}

function choose(i){

let correct=questions[current][2]
let correctAns=questions[current][1][correct]

document.querySelectorAll(".answer").forEach(el=>{

if(el.innerText===correctAns)
el.classList.add("correct")
else
el.classList.add("wrong")

})

if(i===correct){
correctCount++
correctSound.play()
}else{
wrongCount++
wrongSound.play()
}

correctText.innerText="Đáp án đúng: "+correctAns

setTimeout(()=>{

current++

if(current<questions.length){
load()
}else{
finish()
}

},1200)

}

function finish(){

clearInterval(timer)

quiz.style.display="none"

let total=questions.length
let percent=Math.round(correctCount/total*100)

let grade=""

if(percent>=80) grade="Giỏi"
else if(percent>=65) grade="Khá"
else if(percent>=50) grade="Trung bình"
else grade="Cần cố gắng"

result.innerHTML=

"<h2>Hoàn thành bài</h2>"+
"<p>Học sinh: "+studentName+"</p>"+
"<p>Lớp: "+studentClass+"</p>"+
"<h3>Đúng: "+correctCount+"</h3>"+
"<h3>Sai: "+wrongCount+"</h3>"+
"<h3>Tỷ lệ: "+percent+"%</h3>"+
"<h3>Xếp loại: "+grade+"</h3>"+
"<br><button onclick='location.reload()'>Làm lại bài</button>"

drawChart()

}

function drawChart(){

let c=document.getElementById("chart")
let ctx=c.getContext("2d")

let total=correctCount+wrongCount

let correctAngle=(correctCount/total)*2*Math.PI

ctx.clearRect(0,0,300,300)

ctx.beginPath()
ctx.moveTo(150,150)
ctx.arc(150,150,120,0,correctAngle)
ctx.fillStyle="#2ecc71"
ctx.fill()

ctx.beginPath()
ctx.moveTo(150,150)
ctx.arc(150,150,120,correctAngle,2*Math.PI)
ctx.fillStyle="#e74c3c"
ctx.fill()

}

</script>

</body>
</html>
