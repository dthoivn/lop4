<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Tin học 4 – Bài 8</title>
<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white;overflow-x:hidden}
.screen{max-width:1000px;margin:auto;padding:20px}
.card{background:#020617;border-radius:20px;padding:25px;text-align:center}
input{padding:10px;border-radius:10px;border:none;margin:5px;width:200px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:20px}
.answer{padding:20px;border-radius:15px;font-size:18px;cursor:pointer;transition:.3s}
.a0{background:#ef4444}.a1{background:#3b82f6}.a2{background:#facc15;color:black}.a3{background:#22c55e;color:black}
.zoomCorrect{transform:scale(1.15);box-shadow:0 0 20px #22c55e}
.zoomWrong{opacity:.3}
.progress{height:10px;background:#334155;border-radius:5px;overflow:hidden;margin-bottom:10px}
.bar{height:100%;background:#22c55e;width:0%}
#circleBox{position:relative;width:120px;margin:auto}
#time{position:absolute;top:42px;left:0;width:120px;text-align:center;font-size:22px}
canvas{position:fixed;top:0;left:0;pointer-events:none}
button{padding:10px 25px;border-radius:10px;border:none;background:#22c55e;font-size:16px;cursor:pointer;margin-top:15px}
.rank{font-size:20px;margin-top:10px}
</style>
</head>
<body>

<canvas id="fx"></canvas>

<div class="screen">
<div id="start" class="card">
<h2>🧠 TIN HỌC 4 – BÀI 8</h2>
<input id="name" placeholder="Tên học sinh">
<input id="cls" placeholder="Lớp"><br>
<button onclick="begin()">BẮT ĐẦU</button>
</div>

<div id="quiz" class="card" style="display:none">
<div class="progress"><div id="bar" class="bar"></div></div>

<div id="circleBox">
<svg width="120" height="120">
<circle cx="60" cy="60" r="50" stroke="#334155" stroke-width="8" fill="none"/>
<circle id="ring" cx="60" cy="60" r="50" stroke="#22c55e" stroke-width="8"
stroke-dasharray="314" stroke-dashoffset="0" fill="none"/>
</svg>
<div id="time">20</div>
</div>

<h3 id="question"></h3>
<div id="remain"></div>
<div class="answers" id="answers"></div>
</div>

<div id="end" class="card" style="display:none">
<h2>🎉 HOÀN THÀNH</h2>
<p id="result"></p>
<div class="rank" id="rank"></div>
<button onclick="location.reload()">LÀM LẠI</button>
</div>
</div>

<script>

// ===== DANH SÁCH 70 CÂU (giữ nguyên của bạn) =====
let questions = [...YOUR_QUESTIONS_HERE...];

questions.sort(()=>Math.random()-0.5);

let cur=0,score=0,time=20,timer;
const bar=document.getElementById('bar');
const timeEl=document.getElementById('time');
const ring=document.getElementById('ring');
const total=questions.length;

function shuffle(a){
return a.map(v=>[Math.random(),v])
.sort((x,y)=>x[0]-y[0])
.map(v=>v[1]);
}

function begin(){
start.style.display='none';
quiz.style.display='block';
load();
}

function load(){
if(cur>=total){finish();return;}

bar.style.width=(cur/total*100)+'%';
question.innerText='Câu '+(cur+1)+': '+questions[cur][0];
remain.innerText='Còn '+(total-cur)+' câu';

let arr=shuffle(questions[cur][1].map((t,i)=>({t,i})));
answers.innerHTML='';

arr.forEach((o,k)=>{
answers.innerHTML+=
`<div class="answer a${k}" onclick="pick(${o.i},this)">
${o.t}</div>`;
});

startTimer();
}

function startTimer(){
clearInterval(timer);
time=20;
ring.style.strokeDashoffset=0;

timer=setInterval(()=>{
time--;
timeEl.innerText=time;
ring.style.strokeDashoffset = 314-(314*(time/20));

if(time<=0){
clearInterval(timer);
show(-1);
}
},1000);
}

function pick(i){
clearInterval(timer);
show(i);
}

function show(i){
let c=questions[cur][2];
let correctText=questions[cur][1][c];

if(i===c) score++;

let fb=document.createElement('div');
fb.style.marginTop='10px';
fb.style.color='#22c55e';
fb.innerHTML='👉 Câu trả lời đúng là: <b>'+correctText+'</b>';
answers.appendChild(fb);

document.querySelectorAll('.answer').forEach(x=>{
if(x.innerText==correctText)
x.classList.add('zoomCorrect');
else
x.classList.add('zoomWrong');
});

setTimeout(()=>{
cur++;
load();
},1200);
}

function finish(){
quiz.style.display='none';
end.style.display='block';

let n=name.value||'HS';
let c=cls.value||'';
result.innerText=n+' ('+c+') đạt '+score+'/'+total;

let percent = score/total*100;
let r = document.getElementById('rank');

if(percent>=90) r.innerText="🏆 Xuất sắc!";
else if(percent>=75) r.innerText="🥇 Giỏi!";
else if(percent>=50) r.innerText="👍 Khá!";
else r.innerText="💪 Cần cố gắng!";

confetti();
}

// ===== PHÁO GIẤY =====
const canvas=document.getElementById('fx');
const ctx=canvas.getContext('2d');
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

function confetti(){
let pieces=[];
for(let i=0;i<150;i++){
pieces.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height-500,
r:Math.random()*6+4,
d:Math.random()*100,
color:"hsl("+Math.random()*360+",100%,50%)",
tilt:Math.random()*10-10
});
}

let angle=0;
let interval=setInterval(draw,20);

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
angle+=0.01;

for(let i=0;i<pieces.length;i++){
let p=pieces[i];
p.y+=Math.cos(angle+p.d)+3;
p.x+=Math.sin(angle);
ctx.beginPath();
ctx.fillStyle=p.color;
ctx.fillRect(p.x,p.y,p.r,p.r);
}

if(pieces[0].y>canvas.height){
clearInterval(interval);
ctx.clearRect(0,0,canvas.width,canvas.height);
}
}
}

</script>
</body>
</html>
