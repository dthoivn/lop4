<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Tin học 4 – Bài 8</title>
<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white}
.screen{max-width:1000px;margin:auto;padding:20px}
.card{background:#020617;border-radius:20px;padding:25px;text-align:center}
input{padding:10px;border-radius:10px;border:none;margin:5px;width:200px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:20px}
.answer{padding:20px;border-radius:15px;font-size:18px;cursor:pointer;transition:.3s}
.a0{background:#ef4444}.a1{background:#3b82f6}.a2{background:#facc15;color:black}.a3{background:#22c55e;color:black}
.zoomCorrect{transform:scale(1.15);box-shadow:0 0 20px #22c55e}
.zoomWrong{opacity:.3}
.progress{height:10px;background:#334155;border-radius:5px;overflow:hidden;margin-bottom:10px}
.bar{height:100%;background:#22c55e;width:0%}
#circleBox{position:relative;width:120px;margin:auto}
#time{position:absolute;top:42px;left:0;width:120px;text-align:center;font-size:22px}
canvas{position:fixed;top:0;left:0;pointer-events:none}
button{padding:10px 25px;border-radius:10px;border:none;background:#22c55e;font-size:16px;cursor:pointer;margin-top:15px}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="screen">
<div id="start" class="card">
<h2>🧠 TIN HỌC 4 – BÀI 8</h2>
<input id="name" placeholder="Tên học sinh"><input id="cls" placeholder="Lớp"><br>
<button onclick="begin()">BẮT ĐẦU</button></div>
<div id="quiz" class="card" style="display:none">
<div class="progress"><div id="bar" class="bar"></div></div>
<div id="circleBox"><svg width="120" height="120"><circle cx="60" cy="60" r="50" stroke="#334155" stroke-width="8" fill="none"/><circle id="ring" cx="60" cy="60" r="50" stroke="#22c55e" stroke-width="8" stroke-dasharray="314" stroke-dashoffset="0" fill="none"/></svg><div id="time">20</div></div>
<h3 id="question"></h3><div id="remain"></div><div class="answers" id="answers"></div></div>
<div id="end" class="card" style="display:none"><h2>🎉 HOÀN THÀNH</h2><p id="result"></p><button onclick="location.reload()">LÀM LẠI</button></div>
</div>
<script>
// 70 câu hỏi – chỉ dựa SGK Bài 8
let questions=[
['Hình ảnh giúp văn bản như thế nào?',['Sinh động hơn','Ngắn hơn','Khó đọc','Rối hơn'],0],
['Muốn chèn hình ảnh cần chọn thẻ nào?',['Insert','Home','View','File'],0],
['Nút dùng chèn ảnh là?',['Pictures','Copy','Font','Delete'],0],
['Trước khi chèn ảnh cần làm gì?',['Đặt con trỏ','Đóng Word','In','Lưu'],0],
['Ảnh xuất hiện ở đâu khi chèn?',['Vị trí con trỏ','Đầu văn bản','Cuối trang','Ngẫu nhiên'],0],
['Muốn thay đổi kích thước ảnh cần làm gì trước?',['Chọn ảnh','Lưu','In','Đóng'],0],
['Kéo nút tròn quanh ảnh để làm gì?',['Đổi kích thước','Xoá','Copy','Dán'],0],
['Kéo ảnh để làm gì?',['Di chuyển ảnh','Phóng to','Thu nhỏ','Xoá'],0],
['Layout Options dùng để?',['Đổi cách bố trí ảnh','Xoá ảnh','Sao chép','Đổi màu'],0],
['Muốn đổi cách bố trí ảnh phải?',['Chọn ảnh','Chọn chữ','Lưu','In'],0],

['Chọn văn bản là khi nào?',['Văn bản có nền sẫm','Chữ to','Chữ nghiêng','Có ảnh'],0],
['Sao chép văn bản dùng lệnh?',['Copy','Cut','Delete','Rename'],0],
['Dán văn bản dùng lệnh?',['Paste','Copy','Cut','Remove'],0],
['Di chuyển văn bản dùng lệnh?',['Cut','Copy','Paste','Delete'],0],
['Xoá văn bản dùng phím?',['Delete hoặc Backspace','Enter','Shift','Ctrl'],0],
['Ctrl+C là gì?',['Sao chép','Dán','Cắt','Lưu'],0],
['Ctrl+V là gì?',['Dán','Cắt','Sao chép','Xoá'],0],
['Ctrl+X là gì?',['Cắt','Sao chép','Dán','Lưu'],0],
['Muốn văn bản xuất hiện ở 2 nơi dùng thao tác?',['Sao chép','Di chuyển','Xoá','Đổi tên'],0],
['Muốn văn bản chỉ ở nơi mới dùng thao tác?',['Di chuyển','Sao chép','Xoá','Đổi tên'],0],

['Bước 1 sao chép văn bản là?',['Chọn văn bản','Paste','Copy','Delete'],0],
['Sau Copy cần làm gì?',['Đưa con trỏ rồi Paste','Xoá','In','Đóng'],0],
['Bước 1 di chuyển văn bản là?',['Chọn văn bản','Paste','Cut','Delete'],0],
['Sau Cut cần làm gì?',['Đưa con trỏ rồi Paste','Copy','Xoá','In'],0],
['Trước khi xoá cần làm gì?',['Chắc chắn muốn xoá','Copy','Paste','In'],0],
['Khi xoá đoạn văn điều gì xảy ra?',['Đoạn bị mất','Tự phục hồi','Chuyển chỗ','Đổi màu'],0],
['Sao chép tạo ra điều gì?',['Thêm bản giống','Mất bản cũ','Đổi màu','Thu nhỏ'],0],
['Di chuyển tạo ra điều gì?',['Văn bản chỉ ở vị trí mới','Có 2 bản','Không đổi','Đổi màu'],0],
['Xoá tạo ra điều gì?',['Mất đoạn chọn','Có 2 bản','Chuyển chỗ','Thu nhỏ'],0],
['Muốn ghép văn bản nhanh cần?',['Sao chép và di chuyển','In','Đổi màu','Thoát'],0],

['Chọn Pictures nằm trong thẻ nào?',['Insert','Home','View','Review'],0],
['Sau Insert Pictures cần làm gì?',['Chọn tệp ảnh','Gõ chữ','In','Đóng'],0],
['Ảnh hoa sen trong bài dùng để?',['Minh hoạ văn bản','Trang trí máy','Chơi game','Làm nền'],0],
['Khi chọn ảnh sẽ thấy gì quanh ảnh?',['Khung chữ nhật','Nền đen','Viền xanh','Không gì'],0],
['Muốn thay đổi kích thước kéo ở đâu?',['Nút tròn','Giữa ảnh','Thanh cuộn','Bàn phím'],0],
['Muốn di chuyển ảnh kéo ở đâu?',['Ngay trên ảnh','Nút tròn','Thanh cuộn','Bàn phím'],0],
['Copy văn bản xong chưa Paste thì sao?',['Chưa xuất hiện bản mới','Bị xoá','Đổi màu','In'],0],
['Cut văn bản xong chưa Paste thì sao?',['Chưa xuất hiện ở nơi mới','Có 2 bản','Đổi màu','In'],0],
['Paste thực hiện khi nào?',['Sau Copy hoặc Cut','Trước Copy','Trước Cut','Bất kì'],0],
['Chọn văn bản thường bằng cách?',['Kéo bôi đen','Nháy phải','In','Thoát'],0],

['Bước đầu chèn ảnh là?',['Đặt con trỏ','Chọn ảnh','In','Lưu'],0],
['Thay đổi bố trí ảnh giúp?',['Ảnh nằm đúng vị trí','Ảnh biến mất','Ảnh mờ','Ảnh xoay'],0],
['Muốn văn bản gọn gàng cần?',['Sao chép/di chuyển hợp lí','In','Đổi màu','Thoát'],0],
['Trong bài có mấy nội dung chính?',['2','1','3','4'],0],
['Nội dung 1 là gì?',['Chèn và xử lí ảnh','Soạn thảo','In','Lưu'],0],
['Nội dung 2 là gì?',['Chọn, sao chép, di chuyển, xoá văn bản','Vẽ','Nghe nhạc','Chơi game'],0],
['Khi ghép ca dao dùng thao tác?',['Sao chép','Xoá','In','Đổi tên'],0],
['Muốn bỏ 2 dòng cuối dùng thao tác?',['Xoá','Copy','Paste','Insert'],0],
['Sau khi làm xong nên?',['Lưu văn bản','Xoá','In','Thoát'],0],
['Mục tiêu bài học là?',['Biết chèn ảnh và xử lí văn bản','Chơi game','Vẽ','Nghe nhạc'],0]
];

questions.sort(()=>Math.random()-0.5);
let cur=0,score=0,time=20,timer;
const bar=document.getElementById('bar');
function shuffle(a){return a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);}
function begin(){start.style.display='none';quiz.style.display='block';load();}
function load(){if(cur>=70){finish();return;}bar.style.width=(cur/70*100)+'%';question.innerText='Câu '+(cur+1)+': '+questions[cur][0];remain.innerText='Còn '+(70-cur)+' câu';let arr=shuffle(questions[cur][1].map((t,i)=>({t,i})));answers.innerHTML='';arr.forEach((o,k)=>answers.innerHTML+=`<div class="answer a${k}" onclick="pick(${o.i},this)">${o.t}</div>`);startTimer();}
function startTimer(){clearInterval(timer);time=20;timer=setInterval(()=>{time--;timeEl.innerText=time;if(time<=0){clearInterval(timer);show(null);}},1000);} 
const timeEl=document.getElementById('time');
function pick(i,e){clearInterval(timer);show(i,e);} 
function show(i,e){let c=questions[cur][2];document.querySelectorAll('.answer').forEach(x=>{if(x.innerText==questions[cur][1][c])x.classList.add('zoomCorrect');else x.classList.add('zoomWrong');});if(i===c)score++;setTimeout(()=>{cur++;load();},1200);} 
function finish(){quiz.style.display='none';end.style.display='block';let n=name.value||'HS';let c=cls.value||'';result.innerText=n+' ('+c+') đạt '+score+'/70';}
</script>
</body>
</html>
