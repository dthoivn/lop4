<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Tin học – Bài 1</title>

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(120deg,#dbeafe,#e0f2fe,#dcfce7);
background-size:400% 400%;
animation:bgMove 12s infinite alternate;
}

@keyframes bgMove{
0%{background-position:left}
100%{background-position:right}
}

.screen{
max-width:1000px;
margin:auto;
padding:20px
}

.card{
background:white;
border-radius:20px;
padding:25px;
text-align:center;
box-shadow:0 20px 40px rgba(0,0,0,.2);
}

.answers{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-top:20px
}

.answer{
padding:18px;
border-radius:15px;
font-size:18px;
cursor:pointer;
transition:.3s;
font-weight:bold
}

.answer:hover{transform:scale(1.08)}

.a0{background:#ef4444;color:white}
.a1{background:#3b82f6;color:white}
.a2{background:#facc15}
.a3{background:#22c55e}

.correct{
transform:scale(1.15);
box-shadow:0 0 20px #22c55e
}

.wrong{opacity:.3}

.progress{
height:10px;
background:#cbd5e1;
border-radius:5px;
overflow:hidden;
margin-bottom:10px
}

.bar{
height:100%;
background:#22c55e;
width:0%
}

</style>
</head>

<body>

<div class="screen">

<div id="start" class="card">

<h2>🎮 Tin học – Bài 1-Phần cứng, phần mềm</h2>

<input id="name" placeholder="Tên học sinh">

<br><br>

<button onclick="start()">Bắt đầu</button>

</div>

<div id="quiz" class="card" style="display:none">

<div class="progress"><div id="bar" class="bar"></div></div>

<h3 id="question"></h3>

<div id="answers" class="answers"></div>

</div>

<div id="end" class="card" style="display:none">

<h2>🎉 Kết quả</h2>

<p id="result"></p>

</div>

</div>

<script>

let questions=[

["Thiết bị hiển thị hình ảnh?",["Màn hình","Chuột","Loa","USB"],0],
["Thiết bị nhập dữ liệu?",["Bàn phím","Màn hình","Loa","Máy in"],0],
["Thiết bị phát âm thanh?",["Loa","Chuột","USB","Màn hình"],0],
["Thiết bị in tài liệu?",["Máy in","Chuột","Loa","USB"],0],
["Thiết bị điều khiển máy tính?",["Chuột","Loa","Màn hình","USB"],0],

["Phần cứng là gì?",["Thiết bị có thể chạm","Phần mềm","Internet","File"],0],
["Phần mềm là gì?",["Chương trình","Chuột","Màn hình","USB"],0],
["Ví dụ phần mềm?",["Paint","Bàn phím","Chuột","Màn hình"],0],
["Ví dụ phần cứng?",["Chuột","Chrome","Windows","Paint"],0],
["Máy tính cần?",["Phần cứng và phần mềm","Chuột","USB","Internet"],0]

]

while(questions.length<50){
questions.push(...questions.slice(0,10))
}

questions=questions.slice(0,50)

questions.sort(()=>Math.random()-0.5)

let current=0
let score=0

function start(){

start.style.display="none"
quiz.style.display="block"

load()

}

function load(){

bar.style.width=(current/50*100)+"%"

question.innerText="Câu "+(current+1)+": "+questions[current][0]

let ans=questions[current][1]
.map((a,i)=>({text:a,index:i}))
.sort(()=>Math.random()-0.5)

answers.innerHTML=""

ans.forEach((a,k)=>{

answers.innerHTML+=`
<div class="answer a${k}" onclick="choose(${a.index},this)">
${a.text}
</div>`

})

}

function choose(index,el){

let correct=questions[current][2]

document.querySelectorAll(".answer").forEach(a=>{

if(a.innerText===questions[current][1][correct]){
a.classList.add("correct")
}else{
a.classList.add("wrong")
}

})

if(index===correct) score++

setTimeout(()=>{

current++

if(current>=50){

quiz.style.display="none"
end.style.display="block"

let n=document.getElementById("name").value||"Học sinh"

result.innerText=n+" đạt "+score+"/50 điểm"

}else{

load()

}

},1200)

}

</script>

</body>
</html>
