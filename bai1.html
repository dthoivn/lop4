function shuffle(a){return a.sort(()=>Math.random()-0.5)}
shuffle(questions)

let current=0
let score=0
let total=questions.length

function start(){
 document.getElementById("start").style.display="none"
 document.getElementById("quiz").style.display="block"
 load()
}

function load(){
 document.getElementById("bar").style.width=(current/total*100)+"%"
 let q=questions[current]
 document.getElementById("question").innerText="Câu "+(current+1)+": "+q.q
 let ans=q.a.map((v,i)=>({t:v,i}))
 shuffle(ans)
 let html=""
 ans.forEach((a,k)=>{
   html+=`<div class="answer a${k}" onclick="choose(${a.i})">${a.t}</div>`
 })
 document.getElementById("answers").innerHTML=html
 document.getElementById("correctText").innerText=""
}

function choose(i){
 let q=questions[current]
 let correct=q.c
 let correctAns=q.a[correct]
 document.querySelectorAll(".answer").forEach(el=>{
   if(el.innerText===correctAns) el.classList.add("correct")
   else el.classList.add("wrong")
 })
 if(i===correct) score++
 document.getElementById("correctText").innerText="Đáp án đúng: "+correctAns
 setTimeout(()=>{
   current++
   if(current<total) load()
   else finish()
 },1200)
}

let seconds=1800
setInterval(()=>{
 if(document.getElementById("quiz").style.display==="block"){
   seconds--
   let m=Math.floor(seconds/60)
   let s=seconds%60
   document.getElementById("time").innerText=(m<10?"0":"")+m+":"+(s<10?"0":"")+s
 }
},1000)

function finish(){
 document.getElementById("quiz").innerHTML="<h2>Hoàn thành</h2><p>"+document.getElementById("name").value+" đạt "+score+"/"+total+" điểm</p>"
}
