<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>🎮 Game kiểm tra – Gõ bàn phím đúng cách</title>

<style>
body{margin:0;font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#74b9ff,#a29bfe)}
#app{max-width:1000px;margin:20px auto;background:#fff;border-radius:18px;padding:25px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
h1{text-align:center;color:#2d3436}
#top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
#progress{flex:1;height:12px;background:#dfe6e9;border-radius:10px;overflow:hidden;margin:0 15px}
#bar{height:100%;width:0%;background:linear-gradient(90deg,#ffeaa7,#00b894);transition:.4s}
#timer{font-weight:bold;color:#d63031}
.question{font-size:20px;margin:20px 0}
.answers button{display:block;width:100%;margin:10px 0;padding:12px;border:none;border-radius:14px;font-size:16px;cursor:pointer;background:#f1f2f6}
.answers button:hover{background:#dff9fb;transform:scale(1.02)}
.correct{background:#c8e6c9!important}
.wrong{background:#ffcdd2!important}
#next{display:none;margin:20px auto;padding:10px 40px;font-size:16px;border:none;border-radius:20px;background:#0984e3;color:#fff}
#result{display:none;text-align:center;font-size:22px}
#report{display:none;margin-top:20px}
#report table{width:100%;border-collapse:collapse}
#report th,#report td{border:1px solid #ccc;padding:6px;text-align:center}
</style>
</head>

<body>

<div id="app">

<h1>🎮 GAME – GÕ BÀN PHÍM ĐÚNG CÁCH</h1>

<div id="top">
<div id="timer">⏱️ 15:00</div>
<div id="progress"><div id="bar"></div></div>
</div>

<div id="quiz">
<div class="question" id="question"></div>
<div class="answers" id="answers"></div>
</div>

<button id="next">Câu tiếp theo ▶</button>

<div id="result"></div>
<div id="report"></div>

</div>

<script>

const questions=[

{q:"Gõ bàn phím đúng cách giúp?",a:["Nhanh và chính xác","Chậm hơn","Sai nhiều","Không lợi ích"],c:0},
{q:"Gõ đúng cách giúp?",a:["Bảo vệ sức khỏe","Hỏng bàn phím","Chậm hơn","Không"],c:0},
{q:"Hàng phím chuẩn gọi là?",a:["Hàng cơ sở","Hàng trên","Hàng dưới","Hàng số"],c:0},
{q:"Các ngón tay đặt ở đâu khi bắt đầu?",a:["Hàng phím cơ sở","Hàng trên","Hàng dưới","Hàng số"],c:0},
{q:"Ngón trỏ trái đặt ở phím?",a:["F","A","S","D"],c:0},

{q:"Ngón trỏ phải đặt ở phím?",a:["J","K","L","H"],c:0},
{q:"Ngón cái dùng để nhấn phím?",a:["Space","Enter","Tab","Shift"],c:0},
{q:"Phím dùng để tạo khoảng trắng?",a:["Space","Enter","Tab","Backspace"],c:0},
{q:"Phím xuống dòng?",a:["Enter","Shift","Ctrl","Alt"],c:0},
{q:"Phím xóa bên trái con trỏ?",a:["Backspace","Delete","Enter","Tab"],c:0},

{q:"Phím xóa bên phải con trỏ?",a:["Delete","Backspace","Enter","Shift"],c:0},
{q:"Gõ đúng cách giúp?",a:["Không cần nhìn bàn phím","Gõ chậm hơn","Sai nhiều","Không"],c:0},
{q:"Luyện gõ phím giúp?",a:["Tăng tốc độ gõ","Giảm tốc độ","Không thay đổi","Sai nhiều"],c:0},
{q:"Ngón út trái phụ trách phím?",a:["A","S","D","F"],c:0},
{q:"Ngón út phải phụ trách phím?",a:[";","J","K","L"],c:0},

{q:"Ngón giữa trái phụ trách phím?",a:["S","A","D","F"],c:2s},
{q:"Ngón giữa phải phụ trách phím?",a:["K","J","L",";"],c:0},
{q:"Ngón áp út trái phụ trách phím?",a:["D","S","F","A"],c:1},
{q:"Ngón áp út phải phụ trách phím?",a:["L","K","J",";"],c:0},
{q:"Ngón trỏ trái phụ trách phím?",a:["F","A","S","D"],c:0},

{q:"Ngón trỏ phải phụ trách phím?",a:["J","K","L",";"],c:0},
{q:"Sau khi gõ xong phím cần?",a:["Trở về phím cơ sở","Giữ nguyên","Đổi tay","Không"],c:0},
{q:"Phím Shift dùng để?",a:["Viết hoa","Xuống dòng","Xóa","Lưu"],c:0},
{q:"Phím Caps Lock dùng để?",a:["Viết hoa liên tục","Xóa","Lưu","In"],c:0},
{q:"Gõ đúng cách giúp?",a:["Giảm sai sót","Sai nhiều","Không","Chậm"],c:0},

{q:"Khi gõ không nên?",a:["Nhìn bàn phím","Nhìn màn hình","Gõ bằng hai tay","Luyện tập"],c:0},
{q:"Luyện tập gõ phím giúp?",a:["Nhanh hơn","Chậm hơn","Không","Sai"],c:0},
{q:"Phím Tab dùng để?",a:["Tạo khoảng cách","Xóa","In","Lưu"],c:0},
{q:"Phím Ctrl dùng để?",a:["Phím chức năng","Nhập chữ","Xóa","In"],c:0},
{q:"Phím Alt dùng để?",a:["Phím chức năng","Xóa","In","Lưu"],c:0},

{q:"Phím Enter có tác dụng?",a:["Xuống dòng","Xóa","Lưu","In"],c:0},
{q:"Phím Space dài nhất trên bàn phím?",a:["Đúng","Sai","Không","Không biết"],c:0},
{q:"Bàn phím là thiết bị?",a:["Nhập dữ liệu","Xuất dữ liệu","Lưu dữ liệu","In dữ liệu"],c:0},
{q:"Gõ đúng cách cần?",a:["Hai tay","Một tay","Không tay","Chân"],c:0},
{q:"Ngón cái thường đặt ở?",a:["Space","Enter","Tab","Shift"],c:0},

{q:"Gõ phím nhanh cần?",a:["Luyện tập","Không","Sai","Chậm"],c:0},
{q:"Gõ phím đúng giúp?",a:["Hiệu quả hơn","Chậm hơn","Sai hơn","Không"],c:0},
{q:"Bàn phím có nhiều?",a:["Phím","Chuột","Màn hình","Loa"],c:0},
{q:"Gõ đúng giúp?",a:["Tiết kiệm thời gian","Mất thời gian","Sai","Không"],c:0},
{q:"Bàn phím là thiết bị?",a:["Phần cứng","Phần mềm","Internet","File"],c:0},

{q:"Phím dùng để xóa trái?",a:["Backspace","Delete","Enter","Tab"],c:0},
{q:"Phím dùng để xóa phải?",a:["Delete","Backspace","Enter","Tab"],c:0},
{q:"Phím dùng viết hoa?",a:["Shift","Enter","Ctrl","Alt"],c:0},
{q:"Phím tạo khoảng trắng?",a:["Space","Enter","Shift","Tab"],c:0},
{q:"Gõ đúng giúp?",a:["Nhanh hơn","Chậm hơn","Sai","Không"],c:0},

{q:"Gõ đúng giúp?",a:["Chính xác hơn","Sai hơn","Không","Chậm"],c:0},
{q:"Gõ đúng cần?",a:["Luyện tập thường xuyên","Không","Sai","Chậm"],c:0}

];

// logic giống file mẫu bai7
questions.sort(()=>Math.random()-0.5);

let index=0,score=0,details=[];
const qEl=document.getElementById('question');
const aEl=document.getElementById('answers');
const bar=document.getElementById('bar');
const next=document.getElementById('next');
const result=document.getElementById('result');
const report=document.getElementById('report');

let total=15*60;
const timerEl=document.getElementById('timer');

const countdown=setInterval(()=>{
total--;
let m=Math.floor(total/60), s=total%60;
timerEl.textContent=`⏱️ ${m}:${s.toString().padStart(2,'0')}`;
if(total<=0){clearInterval(countdown);finish();}
},1000);

function shuffle(arr){return arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]);}

function load(){
next.style.display='none';
const q=questions[index];
qEl.textContent=`Câu ${index+1}: ${q.q}`;
aEl.innerHTML='';
const answers=shuffle(q.a.map((t,i)=>({t,i})));
answers.forEach(obj=>{
const b=document.createElement('button');
b.textContent=obj.t;
b.onclick=()=>choose(b,obj.i,q.c,q.q,obj.t);
aEl.appendChild(b);
});
bar.style.width=(index/questions.length*100)+'%';
}

function choose(btn,choice,correct,qtext,ans){
[...aEl.children].forEach(b=>b.disabled=true);
const ok=choice===correct;
btn.classList.add(ok?'correct':'wrong');
if(!ok){[...aEl.children].find(b=>b.textContent===questions[index].a[correct]).classList.add('correct');}
if(ok) score++;
details.push({q:qtext,choose:ans,correct:questions[index].a[correct],ok});
next.style.display='block';
}

next.onclick=()=>{index++;if(index<questions.length)load();else finish();};

function finish(){
clearInterval(countdown);
document.getElementById('quiz').style.display='none';
next.style.display='none';
bar.style.width='100%';
result.style.display='block';
result.innerHTML=`🎉 Hoàn thành!<br>Điểm: <b>${score}/${questions.length}</b>`;
report.style.display='block';
let html='<h3>📊 BÁO CÁO CHI TIẾT</h3><table><tr><th>Câu</th><th>Đáp án HS</th><th>Đáp án đúng</th><th>Kết quả</th></tr>';
details.forEach((d,i)=>{html+=`<tr><td>${i+1}</td><td>${d.choose}</td><td>${d.correct}</td><td>${d.ok?'✔':'✘'}</td></tr>`});
html+='</table>';
report.innerHTML=html;
}

load();

</script>
</body>
</html>
