<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>🎮 Game kiểm tra – Thông tin trên trang web</title>

<style>
body{margin:0;font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#74b9ff,#a29bfe)}
#app{max-width:1000px;margin:20px auto;background:#fff;border-radius:18px;padding:25px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
h1{text-align:center;color:#2d3436}
#top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
#progress{flex:1;height:12px;background:#dfe6e9;border-radius:10px;overflow:hidden;margin:0 15px}
#bar{height:100%;width:0%;background:linear-gradient(90deg,#ffeaa7,#00b894);transition:.4s}
#timer{font-weight:bold;color:#d63031}
.question{font-size:20px;margin:20px 0}
.answers button{display:block;width:100%;margin:10px 0;padding:12px;border:none;border-radius:14px;font-size:16px;cursor:pointer;background:#f1f2f6}
.answers button:hover{background:#dff9fb;transform:scale(1.02)}
.correct{background:#c8e6c9!important}
.wrong{background:#ffcdd2!important}
#next{display:none;margin:20px auto;padding:10px 40px;font-size:16px;border:none;border-radius:20px;background:#0984e3;color:#fff;cursor:pointer}
#result{display:none;text-align:center;font-size:22px}
#report{display:none;margin-top:20px}
#report table{width:100%;border-collapse:collapse}
#report th,#report td{border:1px solid #ccc;padding:6px;text-align:center}
</style>
</head>

<body>

<div id="app">

<h1>🎮 GAME – THÔNG TIN TRÊN TRANG WEB</h1>

<div id="top">
<div id="timer">⏱️ 15:00</div>
<div id="progress"><div id="bar"></div></div>
</div>

<div id="quiz">
<div class="question" id="question"></div>
<div class="answers" id="answers"></div>
</div>

<button id="next">Câu tiếp theo ▶</button>

<div id="result"></div>
<div id="report"></div>

</div>

<script>

const questions=[

{q:"Trang web có thể chứa loại thông tin nào?",a:["Văn bản, hình ảnh, âm thanh","Chỉ văn bản","Chỉ hình ảnh","Chỉ âm thanh"],c:0},
{q:"Trang web là gì?",a:["Trang thông tin trên Internet","Tệp văn bản","Phần mềm","Thiết bị"],c:0},
{q:"Để xem trang web cần dùng gì?",a:["Trình duyệt web","Chuột","Bàn phím","Máy in"],c:0},
{q:"Ví dụ trình duyệt web?",a:["Chrome","Word","Paint","Excel"],c:0},
{q:"Thông tin trên web có thể ở dạng?",a:["Văn bản","Hình ảnh","Video","Tất cả"],c:3},

{q:"Liên kết trên web gọi là gì?",a:["Siêu liên kết","Đường dẫn tệp","File","Ổ đĩa"],c:0},
{q:"Nháy vào siêu liên kết sẽ?",a:["Mở trang khác","Tắt máy","In trang","Không làm gì"],c:0},
{q:"Khi trỏ chuột vào liên kết thường thấy?",a:["Con trỏ đổi dạng","Máy tính tắt","Màn hình tối","Âm thanh"],c:0},
{q:"Trang web có nhiều liên kết gọi là?",a:["Siêu văn bản","Tệp văn bản","Thư mục","Ổ cứng"],c:0},
{q:"Video trên web có thể chứa?",a:["Hình ảnh và âm thanh","Chỉ chữ","Chỉ ảnh","Không"],c:0},

{q:"Thông tin dạng chữ trên web gọi là?",a:["Văn bản","Âm thanh","Video","Hình động"],c:0},
{q:"Thông tin dạng hình trên web gọi là?",a:["Hình ảnh","Văn bản","Âm thanh","Video"],c:0},
{q:"Thông tin dạng âm thanh gọi là?",a:["Âm thanh","Văn bản","Hình ảnh","Video"],c:0},
{q:"Video là gì?",a:["Hình ảnh chuyển động","Âm thanh","Chữ","Ảnh tĩnh"],c:0},
{q:"Trang web có thể chứa nhiều loại?",a:["Thông tin","Thiết bị","Phần mềm","Bàn phím"],c:0},

{q:"Internet giúp?",a:["Truy cập thông tin","Tắt máy","In văn bản","Xóa dữ liệu"],c:0},
{q:"Trình duyệt giúp?",a:["Xem trang web","In giấy","Nghe nhạc","Xóa file"],c:0},
{q:"Trang web thuộc?",a:["Internet","USB","Ổ cứng","Chuột"],c:0},
{q:"Google Chrome là?",a:["Trình duyệt web","Phần cứng","Chuột","USB"],c:0},
{q:"Trang web có thể chứa?",a:["Hình ảnh","Văn bản","Âm thanh","Tất cả"],c:3},

{q:"Liên kết giúp?",a:["Chuyển trang","In giấy","Tắt máy","Lưu file"],c:0},
{q:"Khi nháy vào liên kết?",a:["Mở trang khác","Máy tắt","Không","In"],c:0},
{q:"Trang web thường có?",a:["Nhiều thông tin","Không thông tin","Không chữ","Không ảnh"],c:0},
{q:"Thông tin trên web giúp?",a:["Học tập","Giải trí","Tìm hiểu","Tất cả"],c:3},
{q:"Internet kết nối?",a:["Nhiều máy tính","Chuột","Loa","USB"],c:0},

{q:"Trang web có thể chứa?",a:["Video","Hình ảnh","Văn bản","Tất cả"],c:3},
{q:"Thông tin trên web thường?",a:["Cập nhật nhanh","Không đổi","Sai","Không"],c:0},
{q:"Trình duyệt dùng để?",a:["Xem web","In giấy","Xóa file","Tắt máy"],c:0},
{q:"Web là viết tắt của?",a:["World Wide Web","Windows Web","Wide Web","Word Web"],c:0},
{q:"WWW nghĩa là?",a:["World Wide Web","Word Web","Wide Web","Window Web"],c:0},

{q:"Trang web thuộc?",a:["Internet","USB","Chuột","Bàn phím"],c:0},
{q:"Thông tin trên web giúp?",a:["Tìm hiểu kiến thức","Chạy bộ","Nấu ăn","Ngủ"],c:0},
{q:"Video trên web có?",a:["Âm thanh","Hình ảnh","Cả hai","Không"],c:2},
{q:"Trang web thường chứa?",a:["Thông tin","Chuột","Bàn phím","Loa"],c:0},
{q:"Liên kết giúp người dùng?",a:["Di chuyển giữa trang","Tắt máy","In","Không"],c:0},

{q:"Internet là mạng?",a:["Máy tính toàn cầu","Chuột","Bàn phím","USB"],c:0},
{q:"Trình duyệt phổ biến?",a:["Chrome","Paint","Word","Excel"],c:0},
{q:"Thông tin web có thể?",a:["Xem","Nghe","Đọc","Tất cả"],c:3},
{q:"Trang web giúp?",a:["Tìm thông tin","In giấy","Xóa file","Tắt máy"],c:0},
{q:"Liên kết thường có màu?",a:["Xanh","Đỏ","Vàng","Đen"],c:0},

{q:"Internet giúp?",a:["Kết nối thông tin","Tắt máy","Ngủ","Chạy"],c:0},
{q:"Trang web có nhiều?",a:["Liên kết","Chuột","Loa","Bàn phím"],c:0},
{q:"Thông tin web có thể?",a:["Văn bản","Hình ảnh","Video","Tất cả"],c:3},
{q:"Trang web là?",a:["Nguồn thông tin","Thiết bị","Phần mềm","USB"],c:0},
{q:"Internet giúp truy cập?",a:["Trang web","Chuột","Bàn phím","Loa"],c:0}

];

// ===== LOGIC GAME (giống file bai7) =====

questions.sort(()=>Math.random()-0.5);

let index=0,score=0,details=[];

const qEl=document.getElementById('question');
const aEl=document.getElementById('answers');
const bar=document.getElementById('bar');
const next=document.getElementById('next');
const result=document.getElementById('result');
const report=document.getElementById('report');

let total=15*60;
const timerEl=document.getElementById('timer');

const countdown=setInterval(()=>{
total--;
let m=Math.floor(total/60), s=total%60;
timerEl.textContent=`⏱️ ${m}:${s.toString().padStart(2,'0')}`;
if(total<=0){clearInterval(countdown);finish();}
},1000);

function shuffle(arr){return arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]);}

function load(){
next.style.display='none';
const q=questions[index];
qEl.textContent=`Câu ${index+1}: ${q.q}`;
aEl.innerHTML='';
const answers=shuffle(q.a.map((t,i)=>({t,i})));
answers.forEach(obj=>{
const b=document.createElement('button');
b.textContent=obj.t;
b.onclick=()=>choose(b,obj.i,q.c,q.q,obj.t);
aEl.appendChild(b);
});
bar.style.width=(index/questions.length*100)+'%';
}

function choose(btn,choice,correct,qtext,ans){
[...aEl.children].forEach(b=>b.disabled=true);
const ok=choice===correct;
btn.classList.add(ok?'correct':'wrong');
if(!ok){
[...aEl.children].find(b=>b.textContent===questions[index].a[correct]).classList.add('correct');
}
if(ok) score++;
details.push({q:qtext,choose:ans,correct:questions[index].a[correct],ok});
next.style.display='block';
}

next.onclick=()=>{index++;if(index<questions.length)load();else finish();};

function finish(){
clearInterval(countdown);
document.getElementById('quiz').style.display='none';
next.style.display='none';
bar.style.width='100%';
result.style.display='block';
result.innerHTML=`🎉 Hoàn thành!<br>Điểm: <b>${score}/${questions.length}</b>`;
report.style.display='block';
let html='<h3>📊 BÁO CÁO CHI TIẾT</h3><table><tr><th>Câu</th><th>Đáp án HS</th><th>Đáp án đúng</th><th>Kết quả</th></tr>';
details.forEach((d,i)=>{html+=`<tr><td>${i+1}</td><td>${d.choose}</td><td>${d.correct}</td><td>${d.ok?'✔':'✘'}</td></tr>`});
html+='</table>';
report.innerHTML=html;
}

load();

</script>

</body>
</html>
